events {
    worker_connections 1024;
}

http {
    # Docker's internal DNS — resolves upstreams at request time, not at startup.
    # Without this, nginx crashes on boot if any upstream container isn't ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 50m;

    server {
        listen 80;

        # This is the PRODUCTION-profile config — upstream names below are
        # the unsuffixed service names (nucleus:8000, centrifugo:8000). The
        # dev profile uses the separate nginx.dev.conf in this same folder,
        # pointed at nucleus-dev:8000 / centrifugo-dev:8000 instead — same
        # split the existing nginx.conf (dev) / docker/fat/nginx.conf (fat)
        # already use, just renamed.

        # ── Django REST API ─────────────────────────────────────────────────
        location /api/v1/internal/ {
            # /api/v1/internal/ (internal/api.py) is called ONLY by
            # nexus-ai, container-to-container over the internal Docker
            # network (NEXUS_NUCLEUS_URL=http://nucleus:8000/api/v1/
            # internal/...) -- nexus-ai never goes through this nginx at
            # all to reach it. It has no business being reachable here;
            # its only other gate is the X-Internal-API-Key header, and
            # endpoints under it return real secrets (decrypted AI-model
            # API keys, raw chat history). This location is a longer/more
            # specific prefix than /api/ below, so nginx matches it first
            # regardless of declaration order.
            return 403;
        }

        location /api/ {
            set $django nucleus:8000;
            proxy_pass         http://$django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Chrome Private Network Access: LAN/Tailscale addresses are
            # treated as "private" by the browser. A public-origin page (the
            # hosted frontend) fetching this private-range target needs this
            # header on the preflight response or Chrome silently blocks the
            # request client-side.
            add_header 'Access-Control-Allow-Private-Network' 'true' always;
        }

        # ── Django media ─────────────────────────────────────────────────────
        location /media/ {
            set $django nucleus:8000;
            proxy_pass         http://$django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Django admin ─────────────────────────────────────────────────────
        location /admin/ {
            set $django nucleus:8000;
            proxy_pass         http://$django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Centrifugo WebSocket ─────────────────────────────────────────────
        # Client auth is currently insecure (--client.insecure) — see backlog
        # task on adding a post-connect token endpoint. Origin header is
        # stripped before proxying: nexus-transport v6.6.2-nexus has no env
        # var/flag to configure allowed_origins, but skips the origin check
        # when no Origin header is present. nginx is our trust boundary.
        # ── Terminal pane (W21): a shell session in the worker, over WebSocket ──
        # The worker checks a short-lived ticket nucleus signed for a person who
        # holds project.terminal; nothing else on the worker is reachable here.
        location = /terminal/ws {
            set $nexus_ai nexus-ai:8000;
            proxy_pass             http://$nexus_ai/api/v1/terminal/ws$is_args$args;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        location /connection/websocket {
            set $centrifugo centrifugo:8000;
            proxy_pass             http://$centrifugo;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_set_header       Origin     "";   # strip — bypasses nexus-transport origin check
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        # ── Centrifugo SSE fallback ──────────────────────────────────────────
        location /connection/sse {
            set $centrifugo centrifugo:8000;
            proxy_pass             http://$centrifugo;
            proxy_http_version     1.1;
            proxy_set_header       Host       $host;
            proxy_set_header       Origin     "";   # strip — same reason
            proxy_read_timeout     3600s;
            proxy_buffering        off;
        }
    }
}
