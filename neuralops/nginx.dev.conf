events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 50m;

    server {
        listen 80;

        # DEV-profile config — same as nginx.conf (production) in this
        # folder, just pointed at the -dev service names.

        location /api/v1/internal/ {
            # Same reasoning as nginx.conf (production) -- nexus-ai-dev
            # calls this container-to-container (NEXUS_NUCLEUS_URL=
            # http://nucleus-dev:8000/api/v1/internal/...), never through
            # nginx. No business being reachable publicly; endpoints under
            # it return decrypted AI-model API keys and raw chat history.
            return 403;
        }

        location /api/ {
            set $django nucleus-dev:8000;
            proxy_pass         http://$django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Private-Network' 'true' always;
        }

        location /media/ {
            set $django nucleus-dev:8000;
            proxy_pass         http://$django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            set $django nucleus-dev:8000;
            proxy_pass         http://$django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Terminal pane (W21): a shell session in the worker, over WebSocket ──
        # The worker checks a short-lived ticket nucleus signed for a person who
        # holds project.terminal; nothing else on the worker is reachable here.
        location = /terminal/ws {
            set $nexus_ai nexus-ai-dev:8000;
            proxy_pass             http://$nexus_ai/api/v1/terminal/ws$is_args$args;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        location = /browser/ws {
            set $nexus_ai nexus-ai-dev:8000;
            proxy_pass             http://$nexus_ai/api/v1/browser/ws$is_args$args;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        location /connection/websocket {
            set $centrifugo centrifugo-dev:8000;
            proxy_pass             http://$centrifugo;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_set_header       Origin     "";
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        location /connection/sse {
            set $centrifugo centrifugo-dev:8000;
            proxy_pass             http://$centrifugo;
            proxy_http_version     1.1;
            proxy_set_header       Host       $host;
            proxy_set_header       Origin     "";
            proxy_read_timeout     3600s;
            proxy_buffering        off;
        }
    }
}
